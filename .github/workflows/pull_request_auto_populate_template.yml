name: Jira PR Description

on:
  # pull_request_target runs in the BASE repo's context: Jira secrets are
  # available and GITHUB_TOKEN is write-capable even for fork PRs (plain
  # pull_request gets no secrets and a read-only token from forks).
  # Safe here because the workflow never checks out or executes PR code —
  # it only reads the branch name and edits the PR body via the GitHub API.
  pull_request_target:
    types: [opened, reopened, synchronize]

concurrency:
  group: pr-description-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  update-pr-description:
    # pull_request_target exposes Jira credentials to every PR on a public repo.
    # Without this gate any fork could name a branch after an arbitrary issue key
    # and have its contents published into a public PR body.
    if: contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: Extract Jira Story Key from Branch Name
        id: extract
        env:
          # Fork-controlled input must flow through env, never inline ${{ }}.
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          UPPER_BRANCH=$(printf '%s' "$BRANCH_NAME" | tr '[:lower:]' '[:upper:]' | sed 's/_/-/g')
          STORY_KEY=$(printf '%s' "$UPPER_BRANCH" | grep -oE '[A-Z]{2,5}-[0-9]+' | head -n 1 || true)
          if [ -z "$STORY_KEY" ]; then
            echo "No Jira key found — skipping PR update"
          fi
          echo "jira_key=$STORY_KEY" >> "$GITHUB_OUTPUT"

      - name: Fetch Jira Story Details
        id: jira
        if: steps.extract.outputs.jira_key != ''
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_KEY: ${{ steps.extract.outputs.jira_key }}
        run: |
          # Fork PRs and contexts without secrets must skip cleanly instead of
          # dying on curl exit 3 (hostless URL when JIRA_BASE_URL is empty).
          if [ -z "$JIRA_BASE_URL" ] || [ -z "$JIRA_USER_EMAIL" ] || [ -z "$JIRA_API_TOKEN" ]; then
            echo "::notice::Jira secrets unavailable in this context — skipping PR update"
            exit 0
          fi

          if ! RESPONSE=$(curl -sSf -u "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" \
            -H "Accept: application/json" \
            "$JIRA_BASE_URL/rest/api/3/issue/$JIRA_KEY"); then
            echo "::warning::Jira fetch failed for $JIRA_KEY — skipping PR update"
            exit 0
          fi

          SUMMARY=$(echo "$RESPONSE" | jq -r '.fields.summary')

          # This query finds each paragraph, joins all text within it,
          # and then joins all paragraphs with a newline.
          DESCRIPTION=$(echo "$RESPONSE" | jq -r '
            .fields.description.content |
            map(
              .content |
              map(.text // "") |
              join("")
            ) |
            join("\n")
          ' 2>/dev/null || echo "No description")

          # This query finds all content and converts "hardBreak" objects
          # into literal newline characters (\n) to preserve the list format.
          ACCEPTANCE_CRITERIA=$(echo "$RESPONSE" | jq -r '
            .fields.customfield_10046.content |
            map(
              .content |
              map(
                if .type == "text" then .text
                elif .type == "hardBreak" then "\n"
                else ""
                end
              ) |
              join("")
            ) |
            join("\n")
          ' 2>/dev/null || echo "No acceptance criteria")

          # Heredoc-style multiline env vars; distinctive delimiter so Jira
          # text containing "EOF" cannot terminate a value early.
          {
            echo "SUMMARY<<JIRA_ENV_EOF"
            echo "$SUMMARY"
            echo "JIRA_ENV_EOF"
            echo "DESCRIPTION<<JIRA_ENV_EOF"
            echo "$DESCRIPTION"
            echo "JIRA_ENV_EOF"
            echo "ACCEPTANCE_CRITERIA<<JIRA_ENV_EOF"
            echo "$ACCEPTANCE_CRITERIA"
            echo "JIRA_ENV_EOF"
          } >> "$GITHUB_ENV"

      - name: Update Pull Request Description
        # Skipped when extraction found no key or the fetch step bailed out.
        if: env.SUMMARY != '' && env.SUMMARY != 'null'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          JIRA_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_KEY: ${{ steps.extract.outputs.jira_key }}
        run: |
          AUTO_START="<!-- JIRA-AUTO-START -->"
          AUTO_END="<!-- JIRA-AUTO-END -->"

          # 1. Get current PR body
          CURRENT_BODY=$(gh pr view "$PR_NUMBER" --json body --jq '.body // ""')

          # 2. Remove old auto-generated section (idempotent behavior)
          if printf '%s' "$CURRENT_BODY" | grep -Fq "$AUTO_START" && printf '%s' "$CURRENT_BODY" | grep -Fq "$AUTO_END"; then
            CLEAN_BODY=$(printf '%s' "$CURRENT_BODY" | sed -e "/$AUTO_START/,/$AUTO_END/d")
          else
            CLEAN_BODY="$CURRENT_BODY"
          fi

          # Remove Jira reference-style links (cleanup leftover bottom links)
          CLEAN_BODY=$(printf '%s\n' "$CLEAN_BODY" | sed '/^\[[A-Z][A-Z0-9_-]*-[0-9]\+\]: https:\/\/.*atlassian\.net\/browse\/.*$/d')

          # Strip previously injected "### Developer Notes" header and standalone "---" separator
          # so they are not duplicated on subsequent runs (developer notes now live above the auto section)
          CLEAN_BODY=$(printf '%s\n' "$CLEAN_BODY" | sed \
            -e '/^### Developer Notes[[:space:]]*$/d' \
            -e '/^---[[:space:]]*$/d')

          # Detect if body contains meaningful developer content
          # Ignore known Jira-generated patterns
          FILTERED_BODY=$(printf '%s\n' "$CLEAN_BODY" | sed '
          /^Note$/d
          /^Overview$/d
          ')

          # Check whether any real developer notes remain
          HAS_NOTES="$(printf '%s' "$FILTERED_BODY" | tr -d '[:space:]')"

          # 3. Build new Jira section
          {
            echo "$AUTO_START"
            echo "### Jira Ticket Number and Link:"
            echo "[$JIRA_KEY]($JIRA_URL/browse/$JIRA_KEY): $SUMMARY"
            echo ""
            echo "### Key Details:"
            echo "$DESCRIPTION"
            echo ""
            echo "### Acceptance Criteria:"
            echo "$ACCEPTANCE_CRITERIA"
            echo ""

            echo "### Checklist (Reviewer Use)"
            echo "- [ ] Linked Jira ticket is correct and accessible"
            echo "- [ ] Summary accurately reflects changes"
            echo "- [ ] Testing steps are clear and reproducible"
            echo "- [ ] Code follows repository standards"
            echo "- [ ] All CI checks pass"
            echo ""

            echo "$AUTO_END"
          } > generated_section.txt

          # 4. Merge with developer notes — notes go BEFORE the auto-generated Jira section
          if [ -n "$HAS_NOTES" ]; then
            {
              echo "### Developer Notes"
              echo ""
              printf '%s\n' "$CLEAN_BODY"
              echo ""
              echo "---"
              echo ""
              cat generated_section.txt
            } > final_body.txt
          else
            cp generated_section.txt final_body.txt
          fi

          # 5. Update PR safely
          gh pr edit "$PR_NUMBER" --body-file final_body.txt
