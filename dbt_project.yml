
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'cp_dbt_standard_package'
version: '2.7.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: 'default'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]

target-path: "target"  # directory which will store compiled SQL files
clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_modules"

models:
  +transient: false
  # Generated semantic view models — CI-generated at run time, never committed to GitHub.
  # Exclude from evaluator checks (no tests/docs expected for generated files).
  semantic_views_generated:
    +tags:
      - semantic_view_generated
    +meta:
      generated_by: generate_semantic_view

vars:
  # dbt_project_evaluator: exclude CI-generated semantic view model path
  # from ALL evaluator checks (naming, docs, tests, direct joins, etc.).
  # Analytics repos write generated files to models/semantic_views_generated/.
  paths_to_exclude: ["models/semantic_views_generated"]

# Automatically reapply Snowflake tags after every dbt run (fixes tag loss on view recreation)
on-run-end:
  - "{{ cp_dbt_standard_package.tag_models_from_results() }}"
  - "{{ cp_dbt_standard_package.call_certified_read_proc() }}"
