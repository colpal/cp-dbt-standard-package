
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'cp_dbt_standard_package'
version: '2.6.2'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: 'default'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]

target-path: "target"  # directory which will store compiled SQL files
clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_modules"

models:
  +transient: false
  dbt_snowflake_monitoring:
    +enabled: false
vars:
  cp_dbt_standard_package:
    enable_artifact_upload: true
    artifacts_database: "{{ env_var('DBT_ARTIFACTS_DATABASE', '') }}"
    artifacts_schema: "{{ env_var('DBT_ARTIFACTS_SCHEMA', '') }}"

on-run-end:
  - >
    {% set cfg = var('cp_dbt_standard_package') %}
    {% set art_db = cfg.get('artifacts_database') or env_var('DBT_ARTIFACTS_DATABASE', '') %}
    {% set art_schema = cfg.get('artifacts_schema') or env_var('DBT_ARTIFACTS_SCHEMA', '') %}

    {% if cfg.get('enable_artifact_upload', true) and art_db and art_schema %}
        {{ log("cp_dbt_standard_package: uploading artifacts to " ~ art_db ~ "." ~ art_schema, info=true) }}
        {{ run_query("USE DATABASE " ~ art_db) }}
        {{ run_query("USE SCHEMA " ~ art_schema) }}
        {{ dbt_artifacts.upload_results(results) }}
    {% else %}
        {{ log("cp_dbt_standard_package: skipping artifact upload (missing db/schema or disabled)", info=true) }}
    {% endif %}
